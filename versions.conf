# Versionen fuer den Add-on-Build (wird von scripts/build-inside.sh eingelesen)

# Version des Add-ons selbst (erscheint in OpenCCU unter "Zusatzsoftware")
ADDON_VERSION=1.0.0

# Perl-Laufzeit (Quelle: https://www.cpan.org/src/5.0/)
PERL_VERSION=5.42.3
# Optional fest pinnen; leer = Pruefsumme wird von cpan.org (.sha256.txt) geholt
PERL_SHA256=""

# FHEM-Release (Quelle: https://fhem.de/fhem-<VERSION>.tar.gz)
FHEM_VERSION=6.5
# Optional fest pinnen (sha256 des Tarballs); leer = keine Pruefung
FHEM_SHA256=""

# CPAN-Module, die in die Perl-Laufzeit eingebaut werden.
# Gefordert: XML::Parser, RPC::XML, Net::SSLeay, IO::Socket::SSL, Device::SerialPort
# Zusaetzlich: JSON (wird von sehr vielen FHEM-Modulen benoetigt)
# Feste Versionen sind moeglich, z.B. "Net::SSLeay@1.94"
CPAN_MODULES="XML::Parser RPC::XML Net::SSLeay IO::Socket::SSL Device::SerialPort JSON"
